# Local development services. Start with: docker compose up -d
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      # Host port 27018 so a locally installed MongoDB on 27017 (e.g. Homebrew) can't shadow it.
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initialises the single-node replica set on first boot (needed for transactions).
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"]
      interval: 5s
      timeout: 10s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web inbox at http://localhost:8025

volumes:
  mongo-data:
